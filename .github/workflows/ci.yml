name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.toxenv }})
    runs-on: ubuntu-latest
    # Python 3.6 / 3.7 are not provided by actions/setup-python on
    # current runners, so each tox env runs in an official python image.
    container: python:${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { toxenv: py36, python: '3.6' }
          - { toxenv: py37, python: '3.7' }
          - { toxenv: py38, python: '3.8' }
          - { toxenv: flake8, python: '3.8' }
    steps:
      - uses: actions/checkout@v4
      - name: Install tox
        run: python -m pip install 'tox<4'
      - name: Run tests
        run: tox -e ${{ matrix.toxenv }}

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build package
        env:
          PACKAGE_VERSION: '0.0.0'
        run: |
          python -m pip install -U setuptools wheel twine
          python setup.py sdist bdist_wheel
          python -m twine check dist/*
