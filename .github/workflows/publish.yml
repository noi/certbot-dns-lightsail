name: Publish

on:
  push:
    tags:
      # Release: published to PyPI (after approval)
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Release candidate: published to TestPyPI only
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build package
        run: |
          python -m pip install -U setuptools wheel twine
          export PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          python setup.py sdist bdist_wheel
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publishing uses PyPI Trusted Publishing (OIDC); no API tokens are stored.
  # The trusted publisher on (Test)PyPI must match this workflow file name
  # and the environment name of each job.
  test-publish:
    needs: build
    if: ${{ contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to replace the
    # CircleCI "hold" approval step.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
