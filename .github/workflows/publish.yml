name: Publish

on:
  push:
    tags:
      # Release: published to PyPI (after approval)
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Release candidate: published to TestPyPI only
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Build package
        run: |
          python -m pip install -U build twine
          export PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Publishing uses PyPI Trusted Publishing (OIDC); no API tokens are stored.
  # The trusted publisher on (Test)PyPI must match this workflow file name
  # and the environment name of each job.
  test-publish:
    needs: build
    if: ${{ contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to replace the
    # CircleCI "hold" approval step.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Builds the Docker image from the package just published to PyPI, on top
  # of the official Certbot image of the newest version the plugin supports.
  docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve versions
        id: versions
        run: |
          plugin_version="${GITHUB_REF_NAME#v}"
          certbot_version="$(curl -fsS https://pypi.org/pypi/certbot/json | python3 -c '
          import json, sys
          releases = json.load(sys.stdin)["releases"]
          versions = [
              tuple(map(int, v.split(".")))
              for v, files in releases.items()
              if v.startswith("5.") and v.replace(".", "").isdigit() and files
          ]
          print(".".join(map(str, max(versions))))
          ')"
          echo "plugin=${plugin_version}" >> "$GITHUB_OUTPUT"
          echo "certbot=${certbot_version}" >> "$GITHUB_OUTPUT"
      - name: Wait for the package on PyPI
        run: |
          for _ in $(seq 60); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/certbot-dns-lightsail/${{ steps.versions.outputs.plugin }}/json" && exit 0
            sleep 10
          done
          exit 1
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: noih/certbot-dns-lightsail
          tags: |
            type=raw,value=${{ steps.versions.outputs.certbot }}-${{ steps.versions.outputs.plugin }}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: noih
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          build-args: |
            CERTBOT_VERSION=${{ steps.versions.outputs.certbot }}
            CERTBOT_DNS_LIGHTSAIL_VERSION=${{ steps.versions.outputs.plugin }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
